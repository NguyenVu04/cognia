[project]
name = "desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "mcp>=1.30.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pyside6>=6.11.1",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff.lint]
select = ["E", "F", "I"]
