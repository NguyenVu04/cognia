[project]
name = "desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pyside6>=6.11.1",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
qt_api = "pyside6"

[tool.ruff.lint]
select = ["E", "F", "I"]
