<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognia examples</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  body { margin: 0; background: Canvas; color: CanvasText; }
  header { padding: 8px 16px; border-bottom: 1px solid GrayText; display: flex;
           gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 49px); }
  #list { overflow-y: auto; border-right: 1px solid GrayText; }
  #list div { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid
              color-mix(in srgb, GrayText 30%, transparent); }
  #list div.on { background: Highlight; color: HighlightText; }
  #detail { overflow-y: auto; padding: 12px 20px 80px; }
  .accepted { color: seagreen; } .rejected { color: firebrick; }
  .pending { color: GrayText; }
  .warn { background: color-mix(in srgb, orange 25%, transparent); border-radius: 4px;
          padding: 1px 6px; margin-right: 4px; font-size: 12px; }
  .err { color: firebrick; font-weight: 600; }
  .msg { border: 1px solid color-mix(in srgb, GrayText 40%, transparent);
         border-radius: 8px; padding: 8px 10px; margin: 8px 0; white-space: pre-wrap; }
  .msg b { display: block; font-size: 12px; color: GrayText; }
  .user { margin-right: 15%; } .assistant { margin-left: 15%;
          background: color-mix(in srgb, Highlight 10%, transparent); }
  .tool { margin-left: 15%; font-family: ui-monospace, monospace; font-size: 12px; }
  details.msg summary { cursor: pointer; color: GrayText; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; min-height: 70px; }
  .think { font-style: italic; color: GrayText; }
  .bar { position: fixed; bottom: 0; right: 0; left: 300px; padding: 10px 20px;
         background: Canvas; border-top: 1px solid GrayText; display: flex; gap: 8px;
         align-items: center; }
  button { font: inherit; padding: 4px 12px; }
  #status { margin-left: auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .reply { border: 1px solid GrayText; border-radius: 8px; padding: 10px; }
  .reply p { white-space: pre-wrap; min-height: 3em; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 40vh; } .bar { left: 0; } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Cognia examples</h1>
  <span id="filters">
    <select id="f-part"><option value="">every part</option><option>seeds</option>
      <option>train</option><option>test</option></select>
    <select id="f-job"><option value="">every job</option><option>voice</option>
      <option>interpretation</option><option>tools</option><option>summary</option></select>
    <select id="f-status"><option value="">every status</option><option>pending</option>
      <option>accepted</option><option>rejected</option></select>
    <select id="f-warn"><option value="">any warning</option><option>mentions_mood</option>
      <option>denies_feelings</option><option>speaks_told_date</option>
      <option>stage_direction</option><option>parrots</option><option>too_long</option>
      <option>misses_show_back</option><option>misses_crisis_line</option>
      <option>junk_fact</option><option>summary_header</option></select>
  </span>
  <span id="progress"></span>
  <small>keys: a accept · r reject · e edit · j next · k back</small>
</header>
<main>
  <nav id="list"></nav>
  <section id="detail"><p>Choose an example.</p></section>
</main>
<div class="bar" id="bar"></div>
<script>
const MODE = "{{MODE}}";
const $ = (id) => document.getElementById(id);
let rows = [], current = -1;

function esc(text) {
  const d = document.createElement("div"); d.textContent = text ?? ""; return d.innerHTML;
}
async function call(url, body) {
  const r = await fetch(url, body ? {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json"}} : undefined);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// ── review ───────────────────────────────────────────────────────────────
async function loadList(keep) {
  const q = new URLSearchParams({part: $("f-part").value, job: $("f-job").value,
    status: $("f-status").value, warn: $("f-warn").value});
  const data = await call("/api/examples?" + q);
  rows = data.examples;
  $("progress").textContent = Object.entries(data.progress)
    .map(([k, [d, n]]) => `${k} ${d}/${n}`).join(" · ");
  $("list").innerHTML = rows.map((r, i) =>
    `<div data-i="${i}"><span class="${r.status}">●</span> ${esc(r.id)}
     <small>${esc(r.character)}</small><br>${r.warnings.map(w =>
     `<span class="warn">${w}</span>`).join("")}</div>`).join("");
  for (const el of $("list").children) el.onclick = () => show(+el.dataset.i);
  if (keep && rows.length) show(Math.min(current, rows.length - 1));
}

function messageHtml(m) {
  if (m.role === "system")
    return `<details class="msg"><summary>system text</summary>${esc(m.content)}</details>`;
  let body = "";
  if (m.reasoning_content) body += `<div class="think">[THINK] ${esc(m.reasoning_content)}</div>`;
  if (m.tool_calls) body += m.tool_calls.map(c =>
    `→ ${esc(c.function.name)}(${esc(c.function.arguments)})`).join("<br>");
  body += esc(m.content);
  return `<div class="msg ${m.role}"><b>${m.role}</b>${body}</div>`;
}

async function show(i) {
  if (i < 0 || i >= rows.length) return;
  current = i;
  for (const el of $("list").children) el.classList.toggle("on", +el.dataset.i === i);
  $("list").children[i].scrollIntoView({block: "nearest"});
  const d = await call("/api/example?id=" + encodeURIComponent(rows[i].id));
  const ex = d.example, job = ex.job;
  const target = job === "interpretation" ? JSON.stringify(ex.target ?? {}, null, 1)
    : (ex.target ?? "");
  const facts = [ex.mood ? `mood ${ex.mood}` : "", ex.crisis ? "CRISIS" : "",
    ex.expect && Object.keys(ex.expect).length ? `expect ${JSON.stringify(ex.expect)}` : "",
    (ex.tags || []).join(", ")].filter(Boolean).join(" · ");
  $("detail").innerHTML = `
    <h2>${esc(d.id)} <small class="${d.status}">${d.status}</small></h2>
    <p>${esc(d.part)} · ${esc(job)} · ${esc(ex.character || "")} · ${esc(ex.today)}
       · ${esc(facts)} · ${d.tools.length} tools offered</p>
    ${d.errors.map(e => `<p class="err">${esc(e)}</p>`).join("")}
    <p>${d.warnings.map(w => `<span class="warn">${w}</span>`).join("")}</p>
    <h3>The prompt</h3>${d.messages.map(messageHtml).join("")}
    <h3>The answer it teaches</h3>${d.answer.map(messageHtml).join("") || "<p>(no target)</p>"}
    <h3>Edit</h3>
    <label>reasoning<textarea id="e-reasoning">${esc(ex.reasoning || "")}</textarea></label>
    <label>target<textarea id="e-target" rows="6">${esc(target)}</textarea></label>
    <label>note<textarea id="e-note" style="min-height:30px">${esc(d.note)}</textarea></label>`;
  $("detail").scrollTop = 0;
}

async function decide(status) {
  if (current < 0) return;
  const ex = rows[current];
  const body = {id: ex.id, status, note: $("e-note").value,
    reasoning: $("e-reasoning").value, target: $("e-target").value};
  try {
    await call("/api/decision", body);
    $("status").textContent = `${ex.id}: ${status}`;
    await loadList(false);
    const next = rows.findIndex(r => r.id === ex.id);
    show(next >= 0 ? Math.min(next + 1, rows.length - 1) : Math.min(current, rows.length - 1));
  } catch (e) { $("status").textContent = e.message; }
}

function setupReview() {
  $("bar").innerHTML = `<button id="b-acc">Accept (a)</button>
    <button id="b-rej">Reject (r)</button><span id="status"></span>`;
  $("b-acc").onclick = () => decide("accepted");
  $("b-rej").onclick = () => decide("rejected");
  for (const id of ["f-part", "f-job", "f-status", "f-warn"])
    $(id).onchange = () => { current = 0; loadList(true); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "a") decide("accepted");
    else if (e.key === "r") decide("rejected");
    else if (e.key === "j") show(current + 1);
    else if (e.key === "k") show(current - 1);
    else if (e.key === "e") { e.preventDefault(); $("e-target")?.focus(); }
  });
  loadList(false).then(() => show(0));
}

// ── rate ─────────────────────────────────────────────────────────────────
let pairs = [];
function scoreSelect(id) {
  return `<select id="${id}"><option value="">–</option>${[1,2,3,4,5].map(n =>
    `<option>${n}</option>`).join("")}</select>`;
}
async function loadPairs() {
  pairs = (await call("/api/pairs")).pairs;
  $("progress").textContent = `${pairs.filter(p => p.rated).length}/${pairs.length} rated`;
  $("list").innerHTML = pairs.map((p, i) =>
    `<div data-i="${i}"><span class="${p.rated ? "accepted" : "pending"}">●</span>
     ${esc(p.id)}</div>`).join("");
  for (const el of $("list").children) el.onclick = () => showPair(+el.dataset.i);
}
function showPair(i) {
  if (i < 0 || i >= pairs.length) return;
  current = i;
  for (const el of $("list").children) el.classList.toggle("on", +el.dataset.i === i);
  const p = pairs[i], c = p.context || {};
  const history = (c.history || []).map(t =>
    `<div class="msg ${t.from === "user" ? "user" : "assistant"}">${esc(t.text)}</div>`).join("");
  $("detail").innerHTML = `<h2>${esc(p.id)}</h2>
    <p>${esc(c.character || "")} · mood ${esc(c.mood || "none")}</p>${history}
    <div class="msg user"><b>user</b>${esc(c.message || "")}</div>
    <div class="pair">${p.replies.map((r, k) => `<div class="reply">
      <b>Reply ${"AB"[k]}</b><p>${esc(r)}</p>
      fits the character ${scoreSelect(`c${k}`)} shows feeling ${scoreSelect(`f${k}`)}
    </div>`).join("")}</div>`;
}
async function rate(better) {
  const scores = [0, 1].map(k => ({character: +$(`c${k}`).value, feeling: +$(`f${k}`).value}));
  try {
    await call("/api/rate", {id: pairs[current].id, better, scores});
    $("status").textContent = `${pairs[current].id}: rated`;
    await loadPairs(); showPair(current + 1);
  } catch (e) { $("status").textContent = e.message; }
}
function setupRate() {
  $("title").textContent = "Cognia: blind rating";
  $("filters").hidden = true;
  $("bar").innerHTML = `<button id="b-a">A is better</button><button id="b-b">B is better</button>
    <button id="b-same">Same</button><span id="status"></span>`;
  $("b-a").onclick = () => rate(0); $("b-b").onclick = () => rate(1);
  $("b-same").onclick = () => rate(null);
  document.addEventListener("keydown", (e) => {
    if (e.key === "j") showPair(current + 1); else if (e.key === "k") showPair(current - 1);
  });
  loadPairs().then(() => showPair(0));
}

MODE === "rate" ? setupRate() : setupReview();
</script>
</body>
</html>
