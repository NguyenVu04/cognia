version: '3'

# Cognia — task runner.
#
# Everything runnable lives in desktop/; the repository root holds documents
# only.

vars:
  APP_DIR: desktop

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install dependencies into desktop/.venv
    dir: '{{.APP_DIR}}'
    cmds:
      - uv sync

  run:
    desc: Run the application, installing dependencies first
    dir: '{{.APP_DIR}}'
    deps: [setup]
    cmds:
      - uv run python -m src

  run:quick:
    desc: Run the application without re-checking dependencies
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m src

  test:
    desc: Run the test suite
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run pytest

  lint:
    desc: Check the code with Ruff
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run ruff check src tests scripts

  dictionary:
    desc: "Build the dictionary from an Open English WordNet release: task dictionary -- <release.xml.gz>"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python scripts/build_dictionary.py {{.CLI_ARGS}} src/resources/dictionary/oewn.sqlite3

  # Fine-tuning the chat model. desktop/finetuning/README.md gives the steps.
  # Every task but ft:setup:gpu, ft:train and ft:export runs in the
  # environment of desktop/.

  ft:prompts:
    desc: "Write the prompts that ask for training examples: task ft:prompts -- <job> --count 100 --seed 1"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.prompts {{.CLI_ARGS}}

  ft:check:
    desc: Check every example, and count the coverage and the warnings
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.examples check finetuning/data

  ft:review:
    desc: Open the page that reviews the examples, on 127.0.0.1
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.review review finetuning/data {{.CLI_ARGS}}

  ft:build:
    desc: Write finetuning/out/train.jsonl from the accepted training examples
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.build finetuning/data finetuning/out

  ft:setup:gpu:
    desc: Install the training tools, on a machine with a CUDA GPU
    dir: '{{.APP_DIR}}'
    cmds:
      - uv sync --project finetuning --extra gpu

  ft:train:
    desc: Train the LoRA adapter, on a machine with a CUDA GPU
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run --project finetuning --extra gpu python -m finetuning.train finetuning/out/train.jsonl finetuning/out/adapter {{.CLI_ARGS}}

  ft:export:
    desc: "Merge and quantise to chat.gguf: task ft:export -- <LICENSE of the base model> --base-date YYYY-MM-DD"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run --project finetuning --extra gpu python -m finetuning.export finetuning/out/adapter finetuning/out/merged {{.CLI_ARGS}}

  ft:eval:
    desc: "Measure a model on the test examples: task ft:eval -- <model.gguf> <name> [--lengths] [--resume]"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.evaluate run {{.CLI_ARGS}}

  ft:rate:
    desc: "Rate the replies of two measured models, blind: task ft:rate -- <name> <name>"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.review rate {{.CLI_ARGS}}

  ft:report:
    desc: "Compare a tuned model with the base model: task ft:report -- <tuned> <base>"
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run python -m finetuning.evaluate report {{.CLI_ARGS}}

  ft:test:
    desc: Run the tests of the fine-tuning tools
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run pytest -c finetuning/pyproject.toml finetuning/tests

  ft:lint:
    desc: Check the fine-tuning tools with Ruff
    dir: '{{.APP_DIR}}'
    cmds:
      - uv run ruff check finetuning
